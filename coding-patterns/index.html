<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Coding Interview Patterns — Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }

  body {
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 40px 36px;
    width: 360px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.10);
  }

  .card-header { text-align: center; }
  .card-icon   { font-size: 40px; margin-bottom: 10px; }
  .card-title  { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 4px; }
  .card-sub    { font-size: 13px; color: #6b7280; }

  .fields { display: flex; flex-direction: column; gap: 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 12px; font-weight: 600; color: #374151;
    letter-spacing: .5px; text-transform: uppercase;
  }
  .field input {
    padding: 11px 14px; border-radius: 8px; border: 1px solid #d1d5db;
    background: #f9fafb; color: #111827; font-size: 14px;
    outline: none; width: 100%; transition: border-color .2s;
  }
  .field input:focus  { border-color: #3b82f6; }

  #login-error {
    display: none; color: #dc2626; font-size: 13px; text-align: center;
    background: #fef2f2; border: 1px solid #fecaca;
    padding: 8px 12px; border-radius: 8px;
  }

  #login-btn {
    padding: 13px; border-radius: 8px; border: none; cursor: pointer;
    background: #1677ff; color: #fff; font-size: 15px; font-weight: 600;
    transition: background .2s; width: 100%;
  }
  #login-btn:hover:not(:disabled) { background: #0958d9; }
  #login-btn:disabled { opacity: .7; cursor: default; }

  /* Access denied overlay */
  #deny-screen {
    display: none; position: fixed; inset: 0; background: #f5f5f5;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 20px; text-align: center; z-index: 9999;
  }
  #deny-screen h1  { font-size: 22px; font-weight: 700; color: #111827; }
  #deny-screen p   { font-size: 14px; color: #6b7280; max-width: 320px; line-height: 1.6; }
  #deny-screen btn-retry {
    margin-top: 8px; padding: 11px 28px; border-radius: 8px;
    border: 1px solid #d1d5db; background: #fff; color: #374151;
    font-size: 14px; cursor: pointer;
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="card-icon">📚</div>
    <h1 class="card-title">Coding Interview Patterns</h1>
    <p class="card-sub">Sign in to access your study material</p>
  </div>

  <div class="fields">
    <div class="field">
      <label>Username</label>
      <input id="usr-input" type="text" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="pwd-input" type="password" placeholder="Enter password" autocomplete="current-password">
    </div>
  </div>

  <p id="login-error"></p>

  <button id="login-btn" onclick="submitLogin()">Sign In</button>
</div>

<div id="deny-screen">
  <div style="font-size:64px">🚫</div>
  <div>
    <h1>Access Denied</h1>
    <p>Too many failed attempts.<br>Please contact the site owner for access.</p>
  </div>
  <button onclick="retryLogin()" style="margin-top:8px;padding:11px 28px;border-radius:8px;border:1px solid #d1d5db;background:#fff;color:#374151;font-size:14px;cursor:pointer;">Try Again</button>
</div>

<script>
  const VALID_USER = "e3c168e0a717c83cc4b0a48148793c8da9c15b6cd875052ff59ff9a12f08b825"; // Bubba143
  const VALID_PASS = "8a4e8d0043cc9d3da8081d96d920dc1e278b326c99bf51d0b427d7ebbd883c79"; // Ad@#2026
  const SESSION_KEY = "bbg_auth_v2";
  const FIRST_LESSON = "two-pointers/introduction-to-two-pointers.html";
  let failCount = 0;

  // If already logged in, go straight to first lesson
  if (sessionStorage.getItem(SESSION_KEY) === "ok") {
    window.location.replace(FIRST_LESSON);
  }

  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }

  async function submitLogin() {
    const usr = document.getElementById("usr-input").value.trim();
    const pwd = document.getElementById("pwd-input").value;
    const btn = document.getElementById("login-btn");
    if (!usr || !pwd) { setError("Please enter both username and password."); return; }

    btn.disabled = true; btn.textContent = "Verifying…";
    const [uHash, pHash] = await Promise.all([sha256(usr), sha256(pwd)]);

    if (uHash === VALID_USER && pHash === VALID_PASS) {
      sessionStorage.setItem(SESSION_KEY, "ok");
      window.location.replace(FIRST_LESSON);
    } else {
      failCount++;
      document.getElementById("pwd-input").value = "";
      if (failCount >= 3) {
        document.getElementById("deny-screen").style.display = "flex";
      } else {
        setError(`Invalid username or password. (${3 - failCount} attempt${3-failCount===1?"":"s"} left)`);
        btn.disabled = false; btn.textContent = "Sign In";
        document.getElementById(uHash === VALID_USER ? "pwd-input" : "usr-input").focus();
      }
    }
  }

  function setError(msg) {
    const el = document.getElementById("login-error");
    el.textContent = msg; el.style.display = "block";
    document.getElementById("login-btn").disabled = false;
    document.getElementById("login-btn").textContent = "Sign In";
  }

  function retryLogin() {
    failCount = 0;
    document.getElementById("usr-input").value = "";
    document.getElementById("pwd-input").value = "";
    document.getElementById("login-error").style.display = "none";
    document.getElementById("deny-screen").style.display = "none";
    document.getElementById("usr-input").focus();
  }

  document.addEventListener("DOMContentLoaded", () => {
    ["usr-input","pwd-input"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") submitLogin();
      });
    });
    document.getElementById("usr-input").focus();
  });
</script>
</body>
</html>
